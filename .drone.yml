---
scireum_m2_volumes: &scireum_m2_volumes
  - name: m2
    path: /root/.m2

kind: pipeline
name: default

platform:
  os: linux
  arch: amd64

clone:
  depth: 1

steps:
  - name: compile
    image: scireum/sirius-build-jdk18
    commands:
      - mvn clean compile
    volumes: *scireum_m2_volumes
    when:
      event:
        - push

  - name: test
    image: scireum/sirius-build-jdk18
    commands:
      - mvn clean test
    volumes: *scireum_m2_volumes
    when:
      event:
        - tag
        - pull_request

  - name: deploy
    image: scireum/sirius-build-jdk18
    commands:
      - sed -i 's/DEVELOPMENT-SNAPSHOT/${DRONE_TAG}/g' pom.xml
      - mvn clean deploy -DskipTests
    volumes: *scireum_m2_volumes
    when:
      event:
        - tag

  - name: sonarqube
    image: scireum/sirius-build-jdk18
    commands:
      - sed -i 's/DEVELOPMENT-SNAPSHOT/${DRONE_TAG}/g' pom.xml
      - "mvn clean org.jacoco:jacoco-maven-plugin:prepare-agent test package sonar:sonar -Dsonar.projectKey=${DRONE_REPO_NAME}"
    volumes: *scireum_m2_volumes
    when:
      event:
        - tag

volumes:
  - name: m2
    host:
      path: /root/.m2
